name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # the backend workspace (package.json, pnpm-lock.yaml, turbo.json) lives
        # in backend/ now that this repo also holds the frontend, in frontend/
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --cache-dir=.turbo
      - run: pnpm turbo run typecheck --cache-dir=.turbo
      - run: pnpm turbo run test --cache-dir=.turbo
      - run: pnpm exec prettier --check .

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action calls the GitHub API to diff just the PR's commits;
    # without this it 403s with "Resource not accessible by integration"
    # since the default GITHUB_TOKEN has no pull-requests scope.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: backend/.gitleaks.toml
