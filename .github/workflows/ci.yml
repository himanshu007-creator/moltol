name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # the backend workspace (package.json, pnpm-lock.yaml, turbo.json) lives
        # in backend/ now that this repo also holds the frontend, in frontend/
        working-directory: backend
    # Throwaway Postgres + Redis so the API integration tests (apps/api/test)
    # run end to end instead of skipping.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moltol
          POSTGRES_PASSWORD: moltol
          POSTGRES_DB: moltol_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U moltol -d moltol_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://moltol:moltol@localhost:5432/moltol_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --cache-dir=.turbo
      - run: pnpm turbo run typecheck --cache-dir=.turbo
      - run: pnpm turbo run test --cache-dir=.turbo
      - run: pnpm exec prettier --check .

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action calls the GitHub API to diff just the PR's commits;
    # without this it 403s with "Resource not accessible by integration"
    # since the default GITHUB_TOKEN has no pull-requests scope.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: backend/.gitleaks.toml
