  <!-- scale -->
  <line x1="32" y1="22" x2="32" y2="40" stroke="#FFFDF8" stroke-width="3.2" stroke-linecap="round" />
  <line x1="16" y1="25" x2="48" y2="25" stroke="#FFFDF8" stroke-width="3.2" stroke-linecap="round" />
  <line x1="16" y1="25" x2="16" y2="35" stroke="#FFFDF8" stroke-width="2.4" stroke-linecap="round" />
  <line x1="48" y1="25" x2="48" y2="31" stroke="#FFFDF8" stroke-width="2.4" stroke-linecap="round" />
  <path d="M10 35a6 6 0 0 0 12 0z" fill="#FFFDF8" />
  <path d="M42 31a6 6 0 0 0 12 0z" fill="#FFFDF8" />
